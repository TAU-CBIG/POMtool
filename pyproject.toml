[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "POMtool"
version = "100.0.0"
description = "Scientific command line tool"
readme = "README.md"
license = { text = "MIT" }

requires-python = "==3.11.*"

dependencies = [
    "numpy==2.3.2",
    "PyYAML==6.0.2",
    "scimath==5.0.0",
    "scipy==1.16.1",
    "traits==7.0.2",
]

[project.scripts]
POMtool = "pomtool.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
